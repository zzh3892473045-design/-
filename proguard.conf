# Obfuscate only this mod's classes. Minecraft, Fabric, and Mixin stay untouched
# because they are not in the input jar. Shrinking and optimization are off so
# a missing library jar cannot strip code that still runs at runtime.

-dontshrink
-dontoptimize
-dontpreverify
-dontnote
-ignorewarnings
-dontwarn **

-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,RuntimeVisibleAnnotations,RuntimeVisibleParameterAnnotations,RuntimeVisibleTypeAnnotations,AnnotationDefault

# fabric.mod.json client entrypoint. The class name and initializer must stay.
-keep class dev.workspace.client.WorkspaceClient {
    public static final java.lang.String MOD_ID;
    public static final java.lang.String NAME;
    public void onInitializeClient();
    public static dev.workspace.client.WorkspaceClient getInstance();
}

# Classes listed in workspace-client.mixins.json. Renaming them would break loading.
-keep class dev.workspace.client.mixin.** {
    *;
}

# Keep Mixin annotation metadata so the applied mixin plugin can still find injections.
-keepclassmembers class * {
    @org.spongepowered.asm.mixin.* *;
    @org.spongepowered.asm.mixin.gen.* *;
    @org.spongepowered.asm.mixin.injection.* *;
    @org.spongepowered.asm.mixin.injection.callback.* *;
}
